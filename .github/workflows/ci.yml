name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 釘 ubuntu-24.04：ubuntu-latest 將於 2026-10-19 起遷移至 Ubuntu 26，先避開這次變動
    runs-on: ubuntu-24.04
    steps:
      # v7 起目標執行環境為 Node 24（v4 仍為 Node 20，已被 GitHub 棄用警告）
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test
      # 主包體積閘門（真實 UTF-8 位元組，raw 720KiB／gzip 220KiB）：守住 Phase 1 成果不可無聲退化
      - run: npm run check:size