<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>建成國中線上課表系統</title>
  <meta name="application-name" content="JCJH Timetable">
  <!-- 空 favicon：避免瀏覽器請求 /favicon.ico 造成 404 噪音，掩蓋真正的 console 錯誤 -->
  <link rel="icon" href="data:,">
  <!-- 第三方庫（ExcelJS／JSZip／XLSX）走 npm＋vendor-libs 懶載，不再經 CDN -->
  <!-- 樣式改由 src/main.js 引入 src/styles/*，經 Vite 壓縮並加上 content hash 後輸出到 assets/ -->
  <!-- 字型以 link 並行載入，不寫在 CSS 內，避免串行請求 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="app"></div>
  <div id="print-area" style="display: none;"></div>
  <div id="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-msg">
      <div id="confirm-box">
        <div id="confirm-title">請確認</div>
        <div id="confirm-msg"></div>
        <div id="confirm-accounting-period-wrap" aria-label="會計匯出期間">
          <div id="confirm-accounting-period-title">會計匯出設定（六類共用，期間預設整月，可調整）</div>
          <div id="confirm-accounting-period-fields">
            <div>
              <label for="confirm-accounting-period-start">起日</label>
              <input id="confirm-accounting-period-start" type="date" class="form-input" data-autofocus>
            </div>
            <div>
              <label for="confirm-accounting-period-end">迄日</label>
              <input id="confirm-accounting-period-end" type="date" class="form-input">
            </div>
  
            <button id="confirm-accounting-period-reset" type="button" class="btn btn-sm btn-outline-secondary">恢復本月整月</button>
          </div>
        </div>
        <div id="confirm-note-wrap">
          <label for="confirm-note">備註（選填）</label>
          <input id="confirm-note" type="text" class="form-input" placeholder="備註（選填）">
        </div>
        <div id="confirm-actions">
          <button id="confirm-cancel">取消</button>
          <button id="confirm-ok">確認</button>
        </div>
      </div>
    </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
